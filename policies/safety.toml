# Safety Policy for Agentic SOC Extension
# Note: Extension-contributed ALLOW rules are ignored by the CLI for security.
# This file is retained for documentation of required tools.

[[rule]]
name = "Require Approval for Google SecOps MCP Tools"
description = "Ensures all SecOps actions are prompted for user approval by default."
toolName = "/^mcp_GoogleSecOps_/"
decision = "ask_user"
priority = 100

[[rule]]
name = "Require Approval for Database Commands"
description = "Ensures local state management commands are prompted for user approval."
toolName = "run_shell_command"
decision = "ask_user"
priority = 100
