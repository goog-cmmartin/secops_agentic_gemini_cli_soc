# Safety Policy for Agentic SOC Extension
# NOTE: These rules are set to "ask_user", which FORCES a prompt.
# If you want a hands-free experience, remove these rules and use the 
# global "allowedTools" list in your ~/.gemini/settings.json instead.

# Forces approval for Google SecOps MCP Tools
[[rule]]
mcpName = "GoogleSecOps"
toolName = "*"
decision = "ask_user"
priority = 100

# Forces approval for Cloud Logging and Monitoring Tools
[[rule]]
mcpName = "CloudLogging"
toolName = "*"
decision = "ask_user"
priority = 100

[[rule]]
mcpName = "CloudMonitoring"
toolName = "*"
decision = "ask_user"
priority = 100

# Forces approval for local state and identity commands
[[rule]]
toolName = "run_shell_command"
argsPattern = '.*"command":"(sqlite3|dolt|gcloud|env).*'
decision = "ask_user"
priority = 100
